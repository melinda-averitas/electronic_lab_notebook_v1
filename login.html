<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>EcoExposure™ | Login</title>

  <style>
    :root {
      --bg: #f6f8f7;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #6b7280;
      --border: #d7ded9;
      --accent: #0f766e;
      --accent-dark: #115e59;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      padding: 22px 16px;
      background: linear-gradient(135deg, #0f766e, #164e63);
      color: white;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 1.45rem;
    }

    header p {
      margin: 0;
      font-size: 0.95rem;
      opacity: 0.9;
    }

    main {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    .top-nav {
      margin-bottom: 16px;
    }

    .top-nav a {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }

    section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.05);
    }

    h2 {
      margin: 0 0 16px;
      font-size: 1.2rem;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-size: 0.9rem;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: white;
      font-size: 1rem;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 12px 14px;
      background: var(--accent);
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: var(--accent-dark);
    }

    button.secondary {
      background: #e5e7eb;
      color: var(--text);
    }

    button.secondary:hover {
      background: #d1d5db;
    }

    .full {
      grid-column: 1 / -1;
    }

    .status {
      margin-top: 14px;
      padding: 11px 12px;
      border-radius: 10px;
      background: #eef7f5;
      color: var(--muted);
      line-height: 1.4;
    }

    @media (max-width: 520px) {
      .actions {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>EcoExposure™</h1>
    <p>Log in or create an account to collect a new sample.</p>
  </header>

  <main>
    <div class="top-nav">
      <a href="./index.html">← Home</a>
    </div>

    <section>
      <h2>Login</h2>

      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        placeholder="name@example.com"
        autocomplete="email"
      />

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      />

      <div class="actions">
        <button type="button" onclick="signIn()">
          Log In
        </button>

        <button
          class="secondary"
          type="button"
          onclick="signUp()"
        >
          Create Account
        </button>

        <button
          class="secondary full"
          type="button"
          onclick="forgotPassword()"
        >
          Forgot Password
        </button>

        <button
          class="secondary full"
          type="button"
          onclick="signOut()"
        >
          Log Out
        </button>
      </div>

      <div class="status" id="authStatus">
        Not logged in.
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
  "https://wpavjglhayzqyxnhceip.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_so12Fczumz73kItENFdnrA_XSaNN1d3";

// Keep sign-in returns within this app and allow folder/field workflows to resume.
const allowedReturnPages = ["index.html", "folders.html", "new_field_data.html", "my-field-data.html"];
const requestedReturnPage = new URLSearchParams(window.location.search).get("next");
const LOGIN_RETURN_PAGE = allowedReturnPages.includes(requestedReturnPage) ? requestedReturnPage : "index.html";
const LOGIN_REDIRECT_URL = new URL(LOGIN_RETURN_PAGE, window.location.href).toString();
const PASSWORD_RESET_REDIRECT_URL = new URL("reset-password.html", window.location.href).toString();

    const supabaseClient = window.supabase ? window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    ) : null;

    let currentUser = null;
    let authOperationPending = false;

    async function runAuthOperation(operation) {
      if (authOperationPending) return;
      authOperationPending = true;
      const buttons = [...document.querySelectorAll('.actions button')];
      buttons.forEach(button => button.disabled = true);
      const timer = setTimeout(() => {
        getStatusElement().textContent = 'Supabase has not completed this request after 20 seconds. Account creation or login is not confirmed. Check your inbox and Supabase Auth users before retrying. If this persists, try a private browser window and inspect the browser Network panel.';
      }, 20000);
      try { return await operation(); }
      finally {
        clearTimeout(timer);
        authOperationPending = false;
        buttons.forEach(button => button.disabled = false);
      }
    }


    function getStatusElement() {
      return document.getElementById("authStatus");
    }

    function getEmail() {
      return document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();
    }

    function getPassword() {
      return document.getElementById("password").value;
    }

    function accountAvailable() {
      if (supabaseClient) return true;
      getStatusElement().textContent = "Account connection unavailable. Reload the page and check your internet connection.";
      return false;
    }

    function authErrorMessage(error) {
      return error.message + (error.code ? " (" + error.code + ")" : "");
    }

    async function checkAuth() {
      if (!accountAvailable()) return;
      const status = getStatusElement();

      try {
        const { data, error } =
          await supabaseClient.auth.getUser();

        if (authOperationPending) return;
        if (error) {
          currentUser = null;
          status.textContent =
            "Authentication check failed: " + error.message;
          return;
        }

        if (authOperationPending) return;
        currentUser = data.user || null;

        status.textContent = currentUser
          ? `Logged in as ${currentUser.email}`
          : "Not logged in.";
      } catch (error) {
        if (authOperationPending) return;
        currentUser = null;
        status.textContent =
          "Authentication check failed: " + error.message;
      }
    }

    async function signUp() {
      return runAuthOperation(signUpRequest);
    }

    async function signUpRequest() {
      if (!accountAvailable()) return;
      const status = getStatusElement();
      const email = getEmail();
      const password = getPassword();

      if (!email || !password) {
        status.textContent =
          "Enter an email address and password.";
        return;
      }

      if (password.length < 6) {
        status.textContent =
          "Password must contain at least 6 characters.";
        return;
      }

      status.textContent = "Creating account...";

      try {
        const { data, error } =
          await supabaseClient.auth.signUp({
            email: email,
            password: password,
            options: {
              emailRedirectTo: LOGIN_REDIRECT_URL
            }
          });

        if (error) {
          console.error("Sign-up error:", error);

          status.textContent =
            "Sign-up error: " + authErrorMessage(error);

          return;
        }

        if (!data?.user) {
          status.textContent = "Sign-up returned no user. Account creation could not be confirmed.";
          return;
        }
        if (data.session) {
          currentUser = data.user;

          status.textContent =
            "Account created and logged in. Returning to your ELN...";

          window.location.href = LOGIN_RETURN_PAGE;
          return;
        }

        status.textContent =
          "Sign-up request accepted. Check your email for a confirmation link. If you already have an account, log in or reset your password.";
      } catch (error) {
        console.error("Unexpected sign-up error:", error);

        status.textContent =
          "Unexpected sign-up error: " + error.message;
      }
    }

    async function signIn() {
      return runAuthOperation(signInRequest);
    }

    async function signInRequest() {
      if (!accountAvailable()) return;
      const status = getStatusElement();
      const email = getEmail();
      const password = getPassword();

      if (!email || !password) {
        status.textContent =
          "Enter your email address and password.";
        return;
      }

      status.textContent = "Logging in...";

      try {
        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (error) {
          console.error("Login error:", error);

          status.textContent =
            "Login error: " + authErrorMessage(error);

          return;
        }

        if (!data?.user || !data?.session) {
          status.textContent = "Login returned no active session. Please try again.";
          return;
        }
        currentUser = data.user;

        status.textContent =
          `Logged in as ${data.user.email}. Returning to your ELN...`;

        window.location.href = LOGIN_RETURN_PAGE;
      } catch (error) {
        console.error("Unexpected login error:", error);

        status.textContent =
          "Unexpected login error: " + error.message;
      }
    }

    async function forgotPassword() {
      return runAuthOperation(forgotPasswordRequest);
    }

    async function forgotPasswordRequest() {
      if (!accountAvailable()) return;
      const status = getStatusElement();
      const email = getEmail();

      if (!email) {
        status.textContent =
          "Enter your email address first, then select Forgot Password.";
        return;
      }

      status.textContent =
        "Sending password reset email...";

      try {
        const { error } =
          await supabaseClient.auth.resetPasswordForEmail(
            email,
            {
              redirectTo: PASSWORD_RESET_REDIRECT_URL
            }
          );

        if (error) {
          console.error("Password reset error:", error);

          status.textContent =
            "Password reset failed: " + error.message;

          return;
        }

        status.textContent =
          "Password reset email sent. Check your inbox and spam folder.";
      } catch (error) {
        console.error(
          "Unexpected password reset error:",
          error
        );

        status.textContent =
          "Unexpected password reset error: " +
          error.message;
      }
    }

    async function signOut() {
      return runAuthOperation(signOutRequest);
    }

    async function signOutRequest() {
      if (!accountAvailable()) return;
      const status = getStatusElement();

      try {
        const { error } =
          await supabaseClient.auth.signOut();

        if (error) {
          console.error("Logout error:", error);

          status.textContent =
            "Logout error: " + error.message;

          return;
        }

        currentUser = null;
        status.textContent = "Logged out.";
      } catch (error) {
        console.error("Unexpected logout error:", error);

        status.textContent =
          "Unexpected logout error: " + error.message;
      }
    }

    checkAuth();
  </script>
</body>
</html>
